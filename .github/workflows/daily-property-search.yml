name: Daily property search

on:
  schedule:
    - cron: "17 3 * * *"   # 08:47 IST every day
  workflow_dispatch: {}      # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Collect, score and rank listings
        run: python -m property_finder run
      - name: Save today's report
        run: |
          git config user.name "property-finder-bot"
          git config user.email "property-finder-bot@users.noreply.github.com"
          git add reports data/listings.json
          git diff --cached --quiet || git commit -m "Daily shortlist $(date +%F)"
          git push
